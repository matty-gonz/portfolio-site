# ─────────────────────────────────────────────────────────────
# nginx-stats.conf — server block for the private analytics page.
#
# Install to /etc/nginx/sites-available/stats, then:
#   sudo ln -s /etc/nginx/sites-available/stats /etc/nginx/sites-enabled/stats
#   sudo nginx -t && sudo systemctl reload nginx
#
# Hostname map, for reference:
#   matthewjgonzalez.me        -> localhost:80    /var/www/html
#   dev.matthewjgonzalez.me    -> localhost:8081  /var/www/staging
#   stats.matthewjgonzalez.me  -> localhost:8082  /var/www/stats   <- this
# ─────────────────────────────────────────────────────────────

server {
    # Bound to loopback ONLY. This is the single most important line in
    # the file. The other two sites listen on all interfaces, so anyone
    # on the same network can reach them by IP. This one is reachable
    # only by a process on the pi itself — in practice, only cloudflared.
    #
    # Consequence: there is no route to this page that does not pass
    # through Cloudflare Access first. Even if the Access policy were
    # deleted tomorrow, the port still isn't exposed to the LAN.
    listen 127.0.0.1:8082;
    listen [::1]:8082;

    server_name _;

    root /var/www/stats;
    index index.html;

    # Its own log, so analytics traffic never pollutes the numbers.
    # (You looking at your stats should not count as a site visit.)
    access_log /var/log/nginx/stats.access.log;
    error_log  /var/log/nginx/stats.error.log;

    # The report is regenerated on a schedule; always revalidate so a
    # reload shows the latest run rather than a cached copy.
    add_header Cache-Control "no-store";

    # Belt and braces. Access already blocks crawlers by requiring
    # login, but if this were ever misconfigured we still don't want
    # it indexed.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Nothing here should ever be a dotfile.
    location ~ /\. {
        deny all;
        return 404;
    }
}
