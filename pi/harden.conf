# ─────────────────────────────────────────────────────────────
# harden.conf — deny rules shared by the live and staging
# server blocks.
#
# Install to /etc/nginx/snippets/harden.conf, then add
#   include snippets/harden.conf;
# inside each server { } block in sites-available/default and
# sites-available/staging.
#
# Why: the doc roots are live git clones, so .git/ sits inside
# the web root and nginx will happily serve it. Before this,
# https://matthewjgonzalez.me/.git/config returned 200.
# ─────────────────────────────────────────────────────────────

# ── REAL VISITOR IPs ──────────────────────────────────────
# Traffic arrives through the Cloudflare tunnel, so the TCP connection
# nginx sees originates from cloudflared on this same machine. Without
# the two lines below every log line reads 127.0.0.1 and all visitors
# look like one person — which also makes the logs useless for
# debugging, not just for analytics.
#
# Cloudflare puts the true client address in CF-Connecting-IP. We only
# trust that header when the connection came from loopback, i.e. from
# cloudflared itself, so an outside caller can't forge it.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;

# Block the git metadata directory and everything under it.
location ~ /\.git(/|$) {
    deny all;
    return 404;
}

# Block the pi/ directory. The doc root is a clone of the whole repo,
# so server configs and setup notes are sitting in the web root —
# /pi/harden.conf was publicly readable, which hands an attacker a map
# of the server. .sh is already covered above; this covers .conf/.md.
location ^~ /pi/ {
    deny all;
    return 404;
}

# Block shell scripts. Nothing in the doc root should ever be
# fetched as a script, and this covers pi/*.sh being tracked
# in the repo.
location ~ \.sh$ {
    deny all;
    return 404;
}

# Block editor/OS junk that occasionally sneaks into a commit.
location ~ /\.(DS_Store|env|htaccess)$ {
    deny all;
    return 404;
}

# ── CACHING ───────────────────────────────────────────────
# Without an explicit Cache-Control, browsers guess a lifetime — usually
# 10% of the file's age. Edit a file that's a day old and the browser
# decides its copy is good for a couple of hours, which is why changes
# took a while to appear even on a normal reload.
#
# `no-cache` does NOT mean "don't cache". It means "keep the copy, but
# ask the server before using it." nginx answers 304 Not Modified when
# nothing changed, so a repeat visit costs a few hundred bytes instead
# of a full download. This is what makes Cmd+R behave the way you'd
# expect on HTML, CSS, JS and projects.json.
add_header Cache-Control "no-cache";

# Media is the exception — it doesn't change, so let it cache properly.
# An add_header here replaces the one above for these files only.
# (Most media is served from R2 and unaffected by this; this covers
# favicons and anything else local.)
location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|mp4|mov|webm|woff2?|ttf)$ {
    add_header Cache-Control "public, max-age=604800";
}
