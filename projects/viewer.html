<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matthew Julian González — File</title>
  <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Acme&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nanum+Gothic&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nanum+Gothic+Coding&display=swap">
  <link rel="stylesheet" href="../assets/css/bss-overrides.css">
  <link rel="stylesheet" href="../assets/css/custom.css">
  <style>
    /* ── HEADER ───────────────────────────────────────────── */
    .file-head {
      display: flex;
      align-items: center;
      gap: 1.05rem;
      padding: 0.25rem 0 1.35rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.6rem;
    }
    .file-glyph {
      flex: 0 0 auto;
      width: 23px;
      height: 27px;
      color: var(--kind, var(--accent));
    }
    .file-head-text { flex: 1; min-width: 0; }

    /* These are spans, so they need display:block or the filename and the
       metadata run together on one line. */
    .file-name {
      display: block;
      font-family: 'Nanum Gothic', sans-serif;
      font-size: 1.02rem;
      line-height: 1.35;
      color: var(--text);
      word-break: break-word;
    }
    .file-meta {
      display: block;
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 0.57rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 7px;
    }
    .file-actions { flex: 0 0 auto; display: flex; gap: 0.5rem; }
    .file-btn {
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(126,200,227,0.18);
      border-radius: 3px;
      padding: 8px 17px;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.2s, border-color 0.2s;
    }
    .file-btn:hover {
      background: rgba(126,200,227,0.18);
      border-color: rgba(126,200,227,0.4);
      color: var(--accent);
    }

    /* ── CODE ─────────────────────────────────────────────── */
    .code-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: auto;
      max-height: 74vh;
    }
    .code-table {
      border-collapse: collapse;
      font-family: 'Nanum Gothic Coding', ui-monospace, monospace;
      font-size: 0.78rem;
      line-height: 1.6;
      width: 100%;
    }
    /* Line numbers in their own cell so they can't be selected along with
       the code — copying out of this viewer should give you the source,
       not source with numbers glued to the front of every line. */
    .code-table td.ln {
      user-select: none;
      text-align: right;
      padding: 0 0.85rem 0 0.9rem;
      color: var(--text-dim);
      background: rgba(255,255,255,0.012);
      border-right: 1px solid var(--border);
      width: 1%;
      white-space: nowrap;
      vertical-align: top;
    }
    .code-table td.src {
      padding: 0 1rem 0 0.9rem;
      color: var(--text);
      white-space: pre;
      vertical-align: top;
    }
    .code-table tr:first-child td { padding-top: 0.8rem; }
    .code-table tr:last-child  td { padding-bottom: 0.8rem; }

    /* Minimal highlight.js theme built from the site's own tokens rather
       than pulling in a stock stylesheet that would clash. */
    .hljs-keyword, .hljs-selector-tag, .hljs-built_in,
    .hljs-literal, .hljs-meta-keyword          { color: #b39dfa; }
    .hljs-string, .hljs-regexp, .hljs-addition  { color: #6ee7a8; }
    .hljs-number, .hljs-symbol                  { color: #f2b366; }
    .hljs-comment, .hljs-quote                  { color: rgba(255,255,255,0.3); font-style: italic; }
    .hljs-title, .hljs-name, .hljs-section      { color: #16c1ff; }
    .hljs-attr, .hljs-attribute, .hljs-variable { color: #9fd8ee; }
    .hljs-meta                                  { color: rgba(255,255,255,0.4); }
    .hljs-type, .hljs-class .hljs-title         { color: #f2b366; }
    .hljs-deletion                              { color: #ff8a8a; }

    /* ── MARKDOWN ─────────────────────────────────────────── */
    .md-body {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.6rem 1.8rem;
      color: var(--text);
      font-family: 'Nanum Gothic', sans-serif;
      line-height: 1.7;
    }
    .md-body h1, .md-body h2, .md-body h3 {
      font-family: 'Kanit', sans-serif;
      color: var(--text);
      margin-top: 1.8rem;
      margin-bottom: 0.7rem;
    }
    .md-body h1 { font-size: 1.5rem; }
    .md-body h2 { font-size: 1.2rem; }
    .md-body h3 { font-size: 1rem; }
    .md-body > *:first-child { margin-top: 0; }
    .md-body a { color: var(--accent); }
    .md-body code {
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 0.85em;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 5px;
      color: var(--text);
    }
    .md-body pre {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.9rem 1.1rem;
      overflow-x: auto;
    }
    .md-body pre code { background: none; border: 0; padding: 0; }
    .md-body blockquote {
      border-left: 2px solid var(--border-hover);
      margin-left: 0;
      padding-left: 1rem;
      color: var(--text-muted);
    }
    .md-body table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    .md-body th, .md-body td {
      border: 1px solid var(--border);
      padding: 0.4rem 0.7rem;
      text-align: left;
    }
    .md-body th { background: var(--surface-2); }
    .md-body img { max-width: 100%; border-radius: 4px; }

    /* ── CSV TABLE ────────────────────────────────────────── */
    .csv-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: auto;
      max-height: 74vh;
    }
    .csv-table {
      border-collapse: collapse;
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 0.74rem;
      width: 100%;
    }
    .csv-table th, .csv-table td {
      padding: 0.4rem 0.8rem;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      white-space: nowrap;
      text-align: left;
    }
    .csv-table th {
      position: sticky;
      top: 0;
      background: #0d1017;
      color: var(--text);
      font-weight: normal;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.62rem;
      z-index: 1;
    }
    .csv-table td { color: var(--text-muted); }
    .csv-table tr:hover td { color: var(--text); background: rgba(255,255,255,0.015); }
    .csv-rownum {
      color: var(--text-dim) !important;
      text-align: right !important;
      user-select: none;
      background: rgba(255,255,255,0.012);
    }

    /* ── SHEET TABS ───────────────────────────────────────── */
    .sheet-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.7rem;
    }
    .sheet-tab {
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 6px 13px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .sheet-tab:hover { color: var(--text); border-color: var(--border-hover); }
    .sheet-tab.active {
      color: var(--accent);
      background: var(--accent-dim);
      border-color: rgba(126,200,227,0.3);
    }

    /* ── ZIP LISTING ──────────────────────────────────────── */
    .zip-table td { white-space: nowrap; }
    .zip-name { color: var(--text) !important; }
    .zip-dir  { color: var(--text-dim); }
    .zip-size, .zip-date { text-align: right !important; color: var(--text-muted) !important; }
    .zip-foot {
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-top: 0.8rem;
    }

    /* ── 3D MODEL ─────────────────────────────────────────── */
    .stl-wrap {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    #stl-canvas { width: 100%; height: 68vh; min-height: 340px; }
    #stl-canvas canvas { display: block; }
    .stl-hint {
      position: absolute;
      left: 0.9rem;
      bottom: 0.75rem;
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-dim);
      pointer-events: none;
    }

    /* ── STATES ───────────────────────────────────────────── */
    .v-note {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2rem 1.8rem;
      text-align: center;
      color: var(--text-muted);
      font-family: 'Nanum Gothic', sans-serif;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .v-note strong { color: var(--text); display: block; margin-bottom: 0.5rem; font-weight: normal; }
    .v-note .file-btn { display: inline-block; margin-top: 1.1rem; }
    .v-note code {
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 0.8em;
      color: var(--text);
    }

    @media (max-width: 576px) {
      .file-head { flex-wrap: wrap; }
      .file-actions { width: 100%; }
      .code-table { font-size: 0.7rem; }
    }
  </style>
</head>

  <script src="../assets/bootstrap/js/bootstrap.min.js"></script>
  <script src="../assets/js/main-4.js"></script>
  <script>
    // ── CONFIG ─────────────────────────────────────────────
    // Anything bigger renders as a download prompt instead. Text is capped
    // low because highlighting a multi-megabyte file locks the tab for
    // seconds; binary formats get more headroom since parsing a workbook
    // or mesh is comparatively cheap and STLs are legitimately large.
    const MAX_TEXT   = 2  * 1024 * 1024;
    const MAX_BINARY = 25 * 1024 * 1024;

    // Loaded on demand — a project page never pays for these, and opening
    // a .ino doesn't download the spreadsheet parser.
    const CDN = {
      hljs:   'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js',
      marked: 'https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js',
      xlsx:   'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
      jszip:  'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
      three:  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'
    };

    // Binary formats: fetched as an ArrayBuffer rather than text.
    const XLSX_EXTS = ['xlsx', 'xls', 'xlsm'];
    const ZIP_EXTS  = ['zip'];
    const STL_EXTS  = ['stl'];
    const BINARY    = [...XLSX_EXTS, ...ZIP_EXTS, ...STL_EXTS];

    // Extension -> highlight.js language id. Anything unlisted still
    // renders, just without highlighting.
    const LANGS = {
      ino: 'cpp', c: 'c', h: 'c', cpp: 'cpp', hpp: 'cpp',
      py: 'python', js: 'javascript', ts: 'typescript',
      java: 'java', cs: 'csharp', rb: 'ruby', go: 'go', rs: 'rust',
      sh: 'bash', m: 'matlab', json: 'json', xml: 'xml',
      yml: 'yaml', yaml: 'yaml', html: 'xml', css: 'css', sql: 'sql'
    };

    const MD_EXTS  = ['md', 'markdown'];
    const CSV_EXTS = ['csv', 'tsv'];

    // ── HELPERS ────────────────────────────────────────────
    const $ = id => document.getElementById(id);

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c =>
        ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }

    function fileExt(src) {
      const m = src.split('?')[0].match(/\.([a-z0-9]+)$/i);
      return m ? m[1].toLowerCase() : '';
    }

    function fileLabel(src) {
      try {
        return decodeURIComponent(src.split('/').pop().split('?')[0]);
      } catch { return 'File'; }
    }

    function humanSize(bytes) {
      const n0 = Number(bytes);
      if (!n0 || !isFinite(n0)) return '';
      const units = ['B', 'KB', 'MB', 'GB'];
      let n = n0, u = 0;
      while (n >= 1024 && u < units.length - 1) { n /= 1024; u++; }
      return (u === 0 || n >= 10 ? Math.round(n) : n.toFixed(1)) + ' ' + units[u];
    }

    // Same kind system as the project page, so a chip and its viewer show
    // the same icon and colour.
    const KINDS = {
      doc: {
        ext: ['pdf','doc','docx','txt','md','markdown','rtf'],
        color: '#16c1ff',
        glyph: `<g transform="translate(-1,1)" stroke-linecap="round">
                  <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/>
                  <path d="M14 2v5a1 1 0 0 0 1 1h5"/>
                  <path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>
                </g>`
      },
      code: {
        ext: ['ino','py','c','h','cpp','hpp','js','ts','java','cs','m','rb','go',
              'rs','sh','ipynb','json','xml','yml','yaml','html','css','sql'],
        color: '#6ee7a8',
        glyph: `<g transform="translate(0,1)" stroke-linecap="round">
                  <path d="M4 12.15V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.706.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2h-3.35"/>
                  <path d="M14 2v5a1 1 0 0 0 1 1h5"/>
                  <path d="m5 16-3 3 3 3"/><path d="m9 22 3-3-3-3"/>
                </g>`
      },
      model: {
        ext: ['stl','step','stp','f3d','obj','3mf','iges','igs'],
        color: '#f2b366',
        glyph: `<g transform="translate(0,1)" stroke-linecap="round">
                  <path d="M14 2v5a1 1 0 0 0 1 1h5"/>
                  <path d="M14.692 22H18a2 2 0 0 0 2-2V8a2.4 2.4 0 0 0-.706-1.706l-3.588-3.588A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v3.804"/>
                  <path d="M2.264 13.752 7 16.5l4.737-2.748"/>
                  <path d="M2.995 13.014A2 2 0 0 0 2 14.744v3.516a2 2 0 0 0 .996 1.73l3 1.74a2 2 0 0 0 2.008 0l3-1.74A2 2 0 0 0 12 18.26v-3.517a2 2 0 0 0-.995-1.73l-3-1.742a2 2 0 0 0-1.892-.064z"/>
                  <path d="M7 16.5V22"/>
                </g>`
      },
      archive: {
        ext: ['zip','tar','gz','rar','7z'],
        color: '#93a3b8',
        glyph: `<g transform="translate(-1,1)" stroke-linecap="round">
                  <path d="M13.659 22H18a2 2 0 0 0 2-2V8a2.4 2.4 0 0 0-.706-1.706l-3.588-3.588A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v11.5"/>
                  <path d="M14 2v5a1 1 0 0 0 1 1h5"/>
                  <path d="M8 12v-1"/><path d="M8 18v-2"/><path d="M8 7V6"/>
                  <circle cx="8" cy="20" r="2"/>
                </g>`
      },
      data: {
        ext: ['csv','tsv','xlsx','xls','xlsm','numbers','db','sqlite','mat'],
        color: '#b39dfa',
        glyph: `<g transform="translate(-1,1)" stroke-linecap="round">
                  <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/>
                  <path d="M14 2v5a1 1 0 0 0 1 1h5"/>
                  <path d="M8 13h2"/><path d="M14 13h2"/>
                  <path d="M8 17h2"/><path d="M14 17h2"/>
                </g>`
      }
    };

    function kindOf(ext) {
      for (const [name, k] of Object.entries(KINDS)) if (k.ext.includes(ext)) return name;
      return 'doc';
    }

    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url;
        s.onload = resolve;
        s.onerror = () => reject(new Error('failed to load ' + url));
        document.head.appendChild(s);
      });
    }

    function note(html) { $('content').innerHTML = `<div class="v-note">${html}</div>`; }

    // ── RENDERERS ──────────────────────────────────────────
    function renderCode(text, ext) {
      let html;
      const lang = LANGS[ext];
      if (window.hljs && lang && window.hljs.getLanguage(lang)) {
        try {
          html = window.hljs.highlight(text, { language: lang, ignoreIllegals: true }).value;
        } catch { html = escapeHtml(text); }
      } else {
        html = escapeHtml(text);
      }

      // Split the highlighted markup by line. hljs can leave a span open
      // across a newline, so reopen any unclosed spans on the next line —
      // otherwise one multi-line comment swallows the colour of the rest
      // of the file.
      const rawLines = html.split('\n');
      const lines = [];
      let open = [];
      for (const line of rawLines) {
        const prefix = open.map(c => `<span class="${c}">`).join('');
        const re = /<span class="([^"]*)">|<\/span>/g;
        let m;
        while ((m = re.exec(line)) !== null) {
          if (m[0] === '</span>') open.pop();
          else open.push(m[1]);
        }
        const suffix = '</span>'.repeat(open.length);
        lines.push(prefix + line + suffix);
      }

      const rows = lines.map((l, i) =>
        `<tr><td class="ln">${i + 1}</td><td class="src">${l || ' '}</td></tr>`
      ).join('');

      $('content').innerHTML = `<div class="code-wrap"><table class="code-table">${rows}</table></div>`;
    }

    function renderMarkdown(text) {
      if (!window.marked) { renderCode(text, 'txt'); return; }
      try {
        const html = window.marked.parse(text, { breaks: false, gfm: true });
        $('content').innerHTML = `<div class="md-body">${html}</div>`;
      } catch {
        renderCode(text, 'txt');
      }
    }

    // Minimal RFC-4180 parser: handles quoted fields, embedded commas,
    // escaped quotes and both line ending styles.
    function parseDelimited(text, delim) {
      const rows = [];
      let row = [], field = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"') {
            if (text[i + 1] === '"') { field += '"'; i++; }
            else inQuotes = false;
          } else field += c;
        } else if (c === '"') {
          inQuotes = true;
        } else if (c === delim) {
          row.push(field); field = '';
        } else if (c === '\n') {
          row.push(field); rows.push(row); row = []; field = '';
        } else if (c !== '\r') {
          field += c;
        }
      }
      if (field !== '' || row.length) { row.push(field); rows.push(row); }
      return rows.filter(r => r.length > 1 || r[0] !== '');
    }

    // Shared by CSV/TSV and by each sheet of a workbook.
    function tableMarkup(rows) {
      if (!rows.length) return '';
      const width = Math.max(...rows.map(r => r.length));
      const [head, ...body] = rows;
      const thead = '<tr><th class="csv-rownum"></th>' +
        Array.from({ length: width }, (_, c) =>
          `<th>${escapeHtml(head[c] ?? '')}</th>`).join('') + '</tr>';
      const tbody = body.map((r, i) =>
        `<tr><td class="csv-rownum">${i + 1}</td>` +
        Array.from({ length: width }, (_, c) =>
          `<td>${escapeHtml(r[c] ?? '')}</td>`).join('') + '</tr>'
      ).join('');
      return `<div class="csv-wrap"><table class="csv-table">
                <thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
    }

    function setDims(rows) {
      if (!rows.length) return;
      const cols = Math.max(...rows.map(r => r.length));
      const base = $('file-meta').textContent.split(' · ').slice(0, 2).join(' · ');
      $('file-meta').textContent = `${base} · ${rows.length - 1} rows × ${cols} cols`;
    }

    function renderTable(text, ext) {
      const rows = parseDelimited(text, ext === 'tsv' ? '\t' : ',');
      if (!rows.length) { note('<strong>Empty file</strong>Nothing to show.'); return; }
      $('content').innerHTML = tableMarkup(rows);
      setDims(rows);
    }

    // ── SPREADSHEET ────────────────────────────────────────
    function renderWorkbook(buf) {
      if (!window.XLSX) {
        note(`<strong>Couldn't load the spreadsheet reader</strong>
              The parser failed to download.
              <br><a class="file-btn" href="${escapeHtml($('raw-btn').href)}" download>Download raw</a>`);
        return;
      }
      let wb;
      try {
        wb = window.XLSX.read(new Uint8Array(buf), { type: 'array' });
      } catch (e) {
        note(`<strong>Couldn't read this workbook</strong>
              ${escapeHtml(e.message || 'The file may be corrupt or password protected.')}
              <br><a class="file-btn" href="${escapeHtml($('raw-btn').href)}" download>Download raw</a>`);
        return;
      }

      const names = wb.SheetNames || [];
      if (!names.length) { note('<strong>Empty workbook</strong>No sheets found.'); return; }

      const sheetRows = names.map(n =>
        window.XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', blankrows: false }));

      // Only show the tab strip when there's actually a choice to make.
      const tabs = names.length > 1
        ? `<div class="sheet-tabs">${names.map((n, i) =>
            `<button class="sheet-tab${i === 0 ? ' active' : ''}" data-sheet="${i}">${escapeHtml(n)}</button>`
          ).join('')}</div>`
        : '';

      $('content').innerHTML = tabs + `<div id="sheet-body">${tableMarkup(sheetRows[0])}</div>`;
      setDims(sheetRows[0]);

      if (names.length > 1) {
        $('content').querySelector('.sheet-tabs').addEventListener('click', e => {
          const btn = e.target.closest('.sheet-tab');
          if (!btn) return;
          const i = Number(btn.dataset.sheet);
          $('content').querySelectorAll('.sheet-tab')
            .forEach(b => b.classList.toggle('active', b === btn));
          $('sheet-body').innerHTML = tableMarkup(sheetRows[i]);
          setDims(sheetRows[i]);
        });
      }
    }

    // ── ZIP ────────────────────────────────────────────────
    async function renderArchive(buf) {
      if (!window.JSZip) {
        note(`<strong>Couldn't load the archive reader</strong>
              <br><a class="file-btn" href="${escapeHtml($('raw-btn').href)}" download>Download raw</a>`);
        return;
      }
      let zip;
      try {
        zip = await window.JSZip.loadAsync(buf);
      } catch (e) {
        note(`<strong>Couldn't read this archive</strong>
              It may be corrupt, or a format JSZip doesn't handle (rar, 7z).
              <br><a class="file-btn" href="${escapeHtml($('raw-btn').href)}" download>Download raw</a>`);
        return;
      }

      const entries = [];
      zip.forEach((path, e) => {
        if (e.dir) return;
        entries.push({
          path,
          size: (e._data && e._data.uncompressedSize) || 0,
          date: e.date
        });
      });

      if (!entries.length) { note('<strong>Empty archive</strong>No files inside.'); return; }
      entries.sort((a, b) => a.path.localeCompare(b.path));

      const total = entries.reduce((s, e) => s + e.size, 0);
      const rows = entries.map(e => {
        const name = e.path.split('/').pop();
        const dir  = e.path.slice(0, e.path.length - name.length);
        const d    = e.date ? e.date.toISOString().slice(0, 10) : '';
        return `<tr>
          <td class="zip-name">${dir ? `<span class="zip-dir">${escapeHtml(dir)}</span>` : ''}${escapeHtml(name)}</td>
          <td class="zip-size">${humanSize(e.size) || '—'}</td>
          <td class="zip-date">${d}</td>
        </tr>`;
      }).join('');

      $('content').innerHTML = `
        <div class="csv-wrap">
          <table class="csv-table zip-table">
            <thead><tr><th>File</th><th>Size</th><th>Modified</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <p class="zip-foot">Contents only — nothing has been extracted. Use Download raw for the archive itself.</p>`;

      const base = $('file-meta').textContent.split(' · ').slice(0, 2).join(' · ');
      $('file-meta').textContent =
        `${base} · ${entries.length} files · ${humanSize(total)} uncompressed`;
    }

    // ── STL ────────────────────────────────────────────────
    // Written out rather than pulled from three.js's examples folder,
    // which isn't reliably CDN-hosted. Binary STL is a fixed 50-byte
    // record per triangle, so this is short and has no dependency risk.
    function parseSTL(buf) {
      const dv = new DataView(buf);
      const nTri = buf.byteLength >= 84 ? dv.getUint32(80, true) : 0;
      const isBinary = buf.byteLength === 84 + nTri * 50;

      if (isBinary) {
        const pos = new Float32Array(nTri * 9);
        const nor = new Float32Array(nTri * 9);
        let o = 84;
        for (let t = 0; t < nTri; t++) {
          const nx = dv.getFloat32(o, true), ny = dv.getFloat32(o + 4, true), nz = dv.getFloat32(o + 8, true);
          o += 12;
          for (let v = 0; v < 3; v++) {
            const i = t * 9 + v * 3;
            pos[i]     = dv.getFloat32(o, true);
            pos[i + 1] = dv.getFloat32(o + 4, true);
            pos[i + 2] = dv.getFloat32(o + 8, true);
            nor[i] = nx; nor[i + 1] = ny; nor[i + 2] = nz;
            o += 12;
          }
          o += 2; // attribute byte count
        }
        return { pos, nor, count: nTri };
      }

      // ASCII fallback
      const text = new TextDecoder().decode(buf);
      const verts = [], norms = [];
      const facet = /facet\s+normal\s+([-\d.eE+]+)\s+([-\d.eE+]+)\s+([-\d.eE+]+)([\s\S]*?)endfacet/g;
      const vert  = /vertex\s+([-\d.eE+]+)\s+([-\d.eE+]+)\s+([-\d.eE+]+)/g;
      let m;
      while ((m = facet.exec(text)) !== null) {
        const n = [parseFloat(m[1]), parseFloat(m[2]), parseFloat(m[3])];
        let v, c = 0;
        vert.lastIndex = 0;
        while ((v = vert.exec(m[4])) !== null && c < 3) {
          verts.push(parseFloat(v[1]), parseFloat(v[2]), parseFloat(v[3]));
          norms.push(n[0], n[1], n[2]);
          c++;
        }
      }
      return {
        pos: new Float32Array(verts),
        nor: new Float32Array(norms),
        count: verts.length / 9
      };
    }

    function renderSTL(buf) {
      if (!window.THREE) {
        note(`<strong>Couldn't load the 3D viewer</strong>
              <br><a class="file-btn" href="${escapeHtml($('raw-btn').href)}" download>Download raw</a>`);
        return;
      }

      let geo;
      try {
        geo = parseSTL(buf);
        if (!geo.count) throw new Error('no triangles found');
      } catch (e) {
        note(`<strong>Couldn't read this model</strong>
              ${escapeHtml(e.message)}
              <br><a class="file-btn" href="${escapeHtml($('raw-btn').href)}" download>Download raw</a>`);
        return;
      }

      $('content').innerHTML = `
        <div class="stl-wrap"><div id="stl-canvas"></div>
          <div class="stl-hint">drag to rotate · scroll to zoom</div>
        </div>`;

      const THREE = window.THREE;
      const host  = $('stl-canvas');
      const W = () => host.clientWidth || 800;
      const H = () => host.clientHeight || 500;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, W() / H(), 0.1, 5000);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(W(), H());
      host.appendChild(renderer.domElement);

      const bg = new THREE.BufferGeometry();
      bg.setAttribute('position', new THREE.BufferAttribute(geo.pos, 3));
      bg.setAttribute('normal',   new THREE.BufferAttribute(geo.nor, 3));
      bg.computeBoundingBox();

      // Centre on the origin and scale so any model fills the same frame.
      const box = bg.boundingBox;
      const ctr = new THREE.Vector3(
        (box.min.x + box.max.x) / 2, (box.min.y + box.max.y) / 2, (box.min.z + box.max.z) / 2);
      bg.translate(-ctr.x, -ctr.y, -ctr.z);
      const span = Math.max(box.max.x - box.min.x, box.max.y - box.min.y, box.max.z - box.min.z) || 1;

      const mesh = new THREE.Mesh(bg, new THREE.MeshPhongMaterial({
        color: 0xc9d3dd, specular: 0x223344, shininess: 22, flatShading: true
      }));
      scene.add(mesh);

      scene.add(new THREE.AmbientLight(0xffffff, 0.55));
      const key = new THREE.DirectionalLight(0xffffff, 0.85);
      key.position.set(1, 1.4, 1.2);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x7ec8e3, 0.45);
      rim.position.set(-1.2, -0.6, -1);
      scene.add(rim);

      let dist = span * 2.1;
      camera.position.set(0, 0, dist);

      // Minimal orbit: yaw/pitch on drag, dolly on wheel. Rotating the
      // mesh rather than the camera keeps the lights fixed, so the model
      // stays legible from every angle.
      let dragging = false, px = 0, py = 0;
      mesh.rotation.set(-Math.PI / 2.6, 0, 0);

      const el = renderer.domElement;
      el.style.cursor = 'grab';
      el.addEventListener('pointerdown', e => {
        dragging = true; px = e.clientX; py = e.clientY;
        el.setPointerCapture(e.pointerId); el.style.cursor = 'grabbing';
      });
      el.addEventListener('pointermove', e => {
        if (!dragging) return;
        mesh.rotation.y += (e.clientX - px) * 0.01;
        mesh.rotation.x += (e.clientY - py) * 0.01;
        px = e.clientX; py = e.clientY;
      });
      const stop = e => {
        dragging = false; el.style.cursor = 'grab';
        try { el.releasePointerCapture(e.pointerId); } catch (_) {}
      };
      el.addEventListener('pointerup', stop);
      el.addEventListener('pointercancel', stop);
      el.addEventListener('wheel', e => {
        e.preventDefault();
        dist = Math.min(span * 8, Math.max(span * 0.6, dist * (1 + Math.sign(e.deltaY) * 0.12)));
        camera.position.z = dist;
      }, { passive: false });

      window.addEventListener('resize', () => {
        camera.aspect = W() / H(); camera.updateProjectionMatrix();
        renderer.setSize(W(), H());
      });

      (function loop() { requestAnimationFrame(loop); renderer.render(scene, camera); })();

      const base = $('file-meta').textContent.split(' · ').slice(0, 2).join(' · ');
      $('file-meta').textContent = `${base} · ${geo.count.toLocaleString()} triangles`;
    }

    // ── MAIN ───────────────────────────────────────────────
    (async function () {
      const params = new URLSearchParams(location.search);
      const src    = params.get('src');
      const title  = params.get('title');
      const from   = params.get('from');

      $('back-link').href = from ? `project.html?id=${encodeURIComponent(from)}` : '../index.html';
      $('back-link').textContent = from ? '← Back to project' : '← Back to projects';

      if (!src) {
        $('file-name').textContent = 'No file specified';
        note('<strong>Nothing to show</strong>This page needs a <code>?src=</code> parameter.');
        return;
      }

      const ext  = fileExt(src);
      const kind = KINDS[kindOf(ext)];
      const name = title || fileLabel(src);

      document.title = `Matthew Julian González — ${name}`;
      $('file-name').textContent = name;
      $('file-meta').textContent = ext.toUpperCase();
      $('raw-btn').href = src;
      $('head-glyph').innerHTML =
        `<svg class="file-glyph" viewBox="0 0 22 26" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linejoin="round" style="--kind:${kind.color}"
              aria-hidden="true">${kind.glyph}</svg>`;

      // Start the library download in parallel with the file itself.
      const needs = XLSX_EXTS.includes(ext) ? CDN.xlsx
                  : ZIP_EXTS.includes(ext)  ? CDN.jszip
                  : STL_EXTS.includes(ext)  ? CDN.three
                  : MD_EXTS.includes(ext)   ? CDN.marked
                  : CSV_EXTS.includes(ext)  ? null
                  : LANGS[ext]              ? CDN.hljs : null;
      const libReady = needs ? loadScript(needs).catch(() => null) : Promise.resolve();

      const isBinary = BINARY.includes(ext);

      let res;
      try {
        res = await fetch(src);
      } catch (err) {
        note(`<strong>Couldn't load this file</strong>
              The request was blocked before it started — usually a CORS rule
              on the media bucket. <br>The download button still works.
              <br><a class="file-btn" href="${escapeHtml(src)}" download>Download raw</a>`);
        return;
      }

      if (!res.ok) {
        note(`<strong>File not found (${res.status})</strong>
              The link may be out of date, or the file was renamed in storage.`);
        return;
      }

      const size = Number(res.headers.get('Content-Length')) || 0;
      if (size) $('file-meta').textContent = `${ext.toUpperCase()} · ${humanSize(size)}`;

      const cap = isBinary ? MAX_BINARY : MAX_TEXT;
      if (size > cap) {
        note(`<strong>Too large to preview</strong>
              This file is ${humanSize(size)}; the viewer caps previews at
              ${humanSize(cap)} so the page stays responsive.
              <br><a class="file-btn" href="${escapeHtml(src)}" download>Download raw</a>`);
        return;
      }

      // ---- binary formats ----
      if (isBinary) {
        let buf;
        try {
          buf = await res.arrayBuffer();
        } catch {
          note(`<strong>Couldn't read this file</strong>
                <br><a class="file-btn" href="${escapeHtml(src)}" download>Download raw</a>`);
          return;
        }
        if (!size) $('file-meta').textContent = `${ext.toUpperCase()} · ${humanSize(buf.byteLength)}`;

        await libReady;
        if (XLSX_EXTS.includes(ext))     renderWorkbook(buf);
        else if (ZIP_EXTS.includes(ext)) await renderArchive(buf);
        else                             renderSTL(buf);
        return;
      }

      // ---- text formats ----
      let text;
      try {
        text = await res.text();
      } catch {
        note(`<strong>Couldn't read this file</strong>
              It may be binary rather than text.
              <br><a class="file-btn" href="${escapeHtml(src)}" download>Download raw</a>`);
        return;
      }

      // A stray NUL byte is a reliable sign we've been handed a binary.
      if (text.includes('\0')) {
        note(`<strong>Not a text file</strong>
              This looks like binary data, so there's nothing readable to show.
              <br><a class="file-btn" href="${escapeHtml(src)}" download>Download raw</a>`);
        return;
      }

      await libReady;

      if (MD_EXTS.includes(ext))       renderMarkdown(text);
      else if (CSV_EXTS.includes(ext)) renderTable(text, ext);
      else                             renderCode(text, ext);

      if (!size) {
        const bytes = new TextEncoder().encode(text).length;
        $('file-meta').textContent = `${ext.toUpperCase()} · ${humanSize(bytes)}`;
      }
    })();
  </script>
</body>

</html>
