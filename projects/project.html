<!DOCTYPE html>
<html data-bs-theme="light" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matthew Julian González — Project</title>
  <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Acme&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nanum+Gothic&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nanum+Gothic+Coding&display=swap">
  <link rel="stylesheet" href="../assets/css/bss-overrides.css">
  <link rel="stylesheet" href="../assets/css/custom.css">
  <style>
    /* ── GALLERY ──────────────────────────────────────────── */
    .gallery-img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--border);
      cursor: zoom-in;
      display: block;
      transition: border-color 0.2s, transform 0.2s;
    }
    .gallery-img:hover {
      border-color: var(--border-hover);
      transform: scale(1.02);
    }

    /* ── VIDEO ───────────────────────────────────────────── */
    .gallery-video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      cursor: zoom-in;
    }
    .gallery-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--border);
      display: block;
      transition: border-color 0.2s, transform 0.2s;
      background: #000;
    }
    .gallery-video-wrap:hover .gallery-video {
      border-color: var(--border-hover);
      transform: scale(1.02);
    }
    .gallery-play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
      background: rgba(0,0,0,0.45);
      border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: background 0.2s;
    }
    .gallery-play-icon::after {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 11px solid rgba(255,255,255,0.7);
      margin-left: 2px;
    }
    .gallery-video-wrap:hover .gallery-play-icon {
      background: rgba(0,0,0,0.65);
    }
    .lb-video {
      max-width: 84vw;
      max-height: 60vh;
      width: auto;
      height: auto;
      border-radius: 4px;
      display: block;
      outline: none;
      background: #000;
    }

    .gallery-extra { display: none; }
    .gallery-extra.visible { display: contents; }

    .see-more-btn {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(126,200,227,0.18);
      border-radius: 3px;
      padding: 6px 16px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      margin-top: 0.75rem;
      display: inline-block;
    }
    .see-more-btn:hover {
      background: rgba(126,200,227,0.18);
      border-color: rgba(126,200,227,0.4);
    }

    /* ── DOCUMENT ATTACHMENTS ─────────────────────────────── */
    /* Row of file chips below the gallery toggle. Renders nothing
       at all when a project has no `documents` array. */
    /* Grid rather than flex-wrap so chips share the full content width
       evenly instead of stopping partway across and leaving a ragged
       right edge. Columns collapse 3 -> 2 -> 1 as the page narrows. */
    .doc-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr));
      gap: 0.6rem;
      margin-top: 1.25rem;
      align-items: stretch;
    }
    .doc-row:empty { display: none; }

    .doc-chip {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.55rem 0.9rem 0.55rem 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      text-decoration: none;
      color: var(--text);
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      max-width: 100%;
    }
    .doc-chip:hover {
      background: var(--surface-2);
      /* Falls back to the site accent if a chip somehow has no --kind. */
      border-color: var(--kind-dim, var(--border-hover));
      color: var(--kind, var(--accent));
    }

    .doc-glyph {
      flex: 0 0 auto;
      width: 18px;
      height: 21px;
      /* Muted at rest so a row of chips stays calm; full colour on hover. */
      color: var(--kind, var(--text-muted));
      opacity: 0.62;
      transition: opacity 0.2s;
    }
    .doc-chip:hover .doc-glyph { opacity: 1; }

    .doc-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .doc-title {
      font-family: 'Nanum Gothic', sans-serif;
      font-size: 0.82rem;
      line-height: 1.25;
      color: inherit;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .doc-sub {
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Optional one-line-ish description. Chips without a caption keep the
       original compact shape; captioned ones widen and cap the text at two
       lines so one long description can't dwarf the rest of the row. */
    .doc-caption {
      font-family: 'Nanum Gothic', sans-serif;
      font-size: 0.72rem;
      line-height: 1.35;
      color: var(--text-muted);
      margin-top: 3px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* With a caption the icon aligns to the title line, the way mail
       clients do it — centring against a three-line block would leave it
       floating next to the description instead. The -2px offset lines the
       glyph's optical centre up with the title's cap height. */
    .doc-chip.has-caption {
      align-items: flex-start;
    }
    .doc-chip.has-caption .doc-glyph { margin-top: -2px; }
    .doc-chip.has-caption .doc-sub   { margin-top: 5px; }

    /* Without a caption the title can't wrap, so ellipsis it. With one,
       let it wrap — the chip is wider and there's room. */
    .doc-chip.has-caption .doc-title {
      white-space: normal;
      overflow: visible;
    }

    @media (max-width: 576px) {
      .doc-chip { width: 100%; }
    }

    /* ── LIGHTBOX ─────────────────────────────────────────── */
    .lb-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.93);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1rem 4rem 1.5rem;
      overflow: hidden;
    }
    .lb-overlay.open { display: flex; }

    .lb-img-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
      padding: 0.5rem 0;
    }

    .lb-img {
      max-width: 84vw;
      max-height: 60vh;
      object-fit: contain;
      border-radius: 4px;
      user-select: none;
      animation: lbFade 0.18s ease;
      display: block;
    }
    @keyframes lbFade {
      from { opacity: 0; transform: scale(0.97); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* caption box below image */
    .lb-caption-box {
      width: 100%;
      max-width: 860px;
      margin-top: 0.5rem;
      padding: 0.65rem 1.1rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 4px;
      min-height: 48px;
      flex-shrink: 0;
    }

    .lb-caption-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.2rem;
    }

    .lb-caption-text {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin: 0;
    }

    .lb-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      font-size: 1.6rem;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
      z-index: 10000;
      line-height: 1;
    }
    .lb-btn:hover { background: rgba(126,200,227,0.2); border-color: rgba(126,200,227,0.3); }
    .lb-prev { left: 1.5rem; }
    .lb-next { right: 1.5rem; }

    .lb-close {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      background: none;
      border: none;
      color: rgba(255,255,255,0.45);
      font-size: 1.8rem;
      cursor: pointer;
      z-index: 10000;
      transition: color 0.2s;
      line-height: 1;
      padding: 0;
    }
    .lb-close:hover { color: #fff; }

    /* ── COUNTER + FILMSTRIP ─────────────────────────────── */
    .lb-top-bar {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      pointer-events: none;
      padding: 0 4rem;
      flex-shrink: 0;
      margin-top: 0.25rem;
    }

    .lb-counter {
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--text);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 3px;
      padding: 4px 14px;
      white-space: nowrap;
      pointer-events: none;
    }

    .lb-filmstrip {
      display: flex;
      gap: 5px;
      max-width: 80vw;
      overflow-x: auto;
      padding: 3px 4px;
      scrollbar-width: none;
      pointer-events: all;
      align-items: center;
    }
    .lb-filmstrip::-webkit-scrollbar { display: none; }

    .lb-thumb {
      width: 56px;
      height: 42px;
      object-fit: cover;
      object-position: center;
      border-radius: 3px;
      border: 2px solid rgba(255,255,255,0.12);
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s, opacity 0.15s;
      opacity: 0.5;
      background: #111;
      display: block;
    }
    .lb-thumb:hover { opacity: 0.85; border-color: rgba(255,255,255,0.3); }
    .lb-thumb.active { border-color: var(--accent); opacity: 1; }

    .lb-thumb-video {
      width: 56px;
      height: 42px;
      border-radius: 3px;
      border: 2px solid rgba(255,255,255,0.12);
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s, opacity 0.15s;
      opacity: 0.5;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
    }
    .lb-thumb-video.active { border-color: var(--accent); opacity: 1; }
    .lb-thumb-video:hover { opacity: 0.85; border-color: rgba(255,255,255,0.3); }
  </style>
</head>

  <script src="../assets/bootstrap/js/bootstrap.min.js"></script>
  <script src="../assets/js/main-4.js"></script>
  <script>
    const GALLERY_LIMIT = 4;

    // ── IMAGE DELIVERY ─────────────────────────────────────
    // Cloudflare Transformations resizes and re-encodes on the fly, so a
    // 60px filmstrip thumbnail doesn't cost a 3 MB download. `format=auto`
    // also serves WebP/AVIF to browsers that support them.
    //
    // Free tier covers 5,000 unique transformations per month; each
    // image/width pair counts once and is then cached at the edge, so this
    // library uses roughly 90 of them total.
    //
    // If Transformations isn't enabled on the zone these URLs 404, so every
    // <img> falls back to the original once before giving up. Set this to
    // false to bypass the CDN entirely.
    const IMG_CDN = true;

    function imgURL(src, width) {
      if (!IMG_CDN || isVideo(src)) return src;
      return `/cdn-cgi/image/width=${width},quality=82,format=auto/${src}`;
    }

    // Swap to the untransformed original on first failure, hide on second.
    const IMG_FALLBACK =
      "if(!this.dataset.fb){this.dataset.fb=1;this.src=this.dataset.raw;}" +
      "else{this.style.visibility='hidden';}";

    // ── DOCUMENT ATTACHMENT HELPERS ────────────────────────
    // Attachments are grouped into kinds. Each kind gets its own glyph
    // and accent colour so a row of chips is scannable at a glance —
    // shape carries the meaning, colour reinforces it.
    //
    // To support a new extension, add it to the `ext` list of whichever
    // kind fits. Unknown extensions fall back to `doc`, so nothing ever
    // breaks — it just gets the generic page icon.
    const FILE_KINDS = {
    // All glyphs live in a 22x26 box and are centred on (11, 13). That
    // shared centre is what makes them line up with each other and with
    // the chip title — previously each shape had a different ink height
    // (22 vs 15 units) so none of them agreed on a baseline.
      doc: {
        ext: ['pdf', 'doc', 'docx', 'txt', 'md', 'rtf', 'pages'],
        color: '#16c1ff', dim: 'rgba(22,193,255,0.38)',
        glyph: `<path d="M3 2.5h10l6 6v15H3z"/>
                <path d="M13 2.5v6h6"/>
                <path d="M6.5 13.5h9M6.5 17.5h6" stroke-width="1.3" stroke-linecap="round"/>`
      },
      code: {
        ext: ['ino', 'py', 'c', 'h', 'cpp', 'hpp', 'js', 'ts', 'java', 'cs',
              'm', 'rb', 'go', 'rs', 'sh', 'ipynb', 'json', 'xml', 'yml', 'yaml'],
        color: '#6ee7a8', dim: 'rgba(110,231,168,0.38)',
        glyph: `<path d="M8 6.5 2.5 13 8 19.5" stroke-linecap="round"/>
                <path d="M14 6.5 19.5 13 14 19.5" stroke-linecap="round"/>
                <path d="M12.6 4.5l-3.2 17" stroke-linecap="round"/>`
      },
      model: {
        ext: ['step', 'stp', 'stl', 'f3d', 'sldprt', 'sldasm', 'iges', 'igs',
              'obj', '3mf', 'dxf', 'dwg', 'ipt', 'iam', 'x_t', 'gltf'],
        color: '#f2b366', dim: 'rgba(242,179,102,0.38)',
        glyph: `<path d="M11 3.5 19.5 8.25v9.5L11 22.5 2.5 17.75v-9.5z"/>
                <path d="M11 3.5V13M11 13l8.5-4.75M11 13l-8.5-4.75"/>`
      },
      data: {
        ext: ['csv', 'tsv', 'xlsx', 'xls', 'numbers', 'db', 'sqlite', 'mat'],
        color: '#b39dfa', dim: 'rgba(179,157,250,0.38)',
        glyph: `<rect x="2.5" y="4.5" width="17" height="17" rx="1.5"/>
                <path d="M2.5 9.5h17M8.2 9.5v12M13.8 9.5v12"/>`
      },
      archive: {
        ext: ['zip', 'tar', 'gz', 'rar', '7z'],
        color: '#93a3b8', dim: 'rgba(147,163,184,0.38)',
        glyph: `<path d="M2.5 8.5h17v13h-17z"/>
                <path d="M2.5 8.5 5 4.5h12l2.5 4"/>
                <path d="M9.4 8.5v3.6h3.2V8.5"/>`
      }
    };

    function kindOf(src) {
      const ext = fileExt(src).toLowerCase();
      for (const [name, k] of Object.entries(FILE_KINDS)) {
        if (k.ext.includes(ext)) return name;
      }
      return 'doc';
    }

    function glyphFor(src) {
      const k = FILE_KINDS[kindOf(src)];
      return `<svg class="doc-glyph" viewBox="0 0 22 26" fill="none"
          stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"
          aria-hidden="true">${k.glyph}</svg>`;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c =>
        ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }

    // Filename minus path and extension, with %20 etc. decoded — used as
    // the chip label when a document has no explicit title.
    function fileLabel(src) {
      try {
        return decodeURIComponent(src.split('/').pop().split('?')[0].replace(/\.[^.]+$/, ''));
      } catch { return 'Document'; }
    }

    function fileExt(src) {
      const m = src.split('?')[0].match(/\.([a-z0-9]+)$/i);
      return m ? m[1].toUpperCase() : 'FILE';
    }

    // Types a browser can actually render. Everything else (.ino, .step,
    // .zip, CAD files) gets the `download` attribute instead of
    // target="_blank", so it saves straight to Downloads rather than
    // flashing a blank tab on its way there.
    const VIEWABLE = ['PDF', 'PNG', 'JPG', 'JPEG', 'GIF', 'WEBP', 'SVG', 'TXT', 'MD'];

    function linkAttrs(src) {
      return VIEWABLE.includes(fileExt(src))
        ? 'target="_blank" rel="noopener noreferrer"'
        : 'download';
    }

    // main-4.js has its own copy of this, but it's scoped inside a block
    // that only runs on the index page. This one is for project pages.
    function fetchWithTimeout(url, options, ms) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), ms);
      return fetch(url, { ...options, signal: controller.signal })
        .finally(() => clearTimeout(timer));
    }

    function humanSize(bytes) {
      const n0 = Number(bytes);
      if (!n0 || !isFinite(n0)) return '';
      const units = ['B', 'KB', 'MB', 'GB'];
      let n = n0, u = 0;
      while (n >= 1024 && u < units.length - 1) { n /= 1024; u++; }
      return (u === 0 || n >= 10 ? Math.round(n) : n.toFixed(1)) + ' ' + units[u];
    }

    // R2 is a different origin, so this only works if the bucket sends
    // CORS headers. If it doesn't, we silently keep just the file type —
    // the chip is fully usable either way.
    async function appendFileSize(src, el) {
      try {
        const res = await fetch(src, { method: 'HEAD' });
        const size = humanSize(res.headers.get('Content-Length'));
        if (size) el.textContent = el.textContent + ' · ' + size;
      } catch { /* no size shown — not worth surfacing */ }
    }

    // ── LIGHTBOX ───────────────────────────────────────────
    let lbImages = []; // array of {src, caption} objects
    let lbIndex  = 0;

    // preload the images immediately before and after current index
    const preloadCache = new Set();
    function preloadAdjacent(index) {
      const neighbors = [index - 1, index + 1];
      for (const i of neighbors) {
        if (i < 0 || i >= lbImages.length) continue;
        const item = lbImages[i];
        const src  = typeof item === 'object' ? item.src : item;
        if (isVideo(src) || preloadCache.has(src)) continue;
        preloadCache.add(src);
        const img = new Image();
        img.src = imgURL(src, 1800);
      }
    }

    let filmstripBuilt = false;

    function buildFilmstrip() {
      if (filmstripBuilt) return; // only build once
      const strip = document.getElementById('lb-filmstrip');
      strip.innerHTML = lbImages.map((item, i) => {
        const src = typeof item === 'object' ? item.src : item;
        if (isVideo(src)) {
          return `<div class="lb-thumb-video" data-index="${i}" title="Video">▶</div>`;
        } else {
          // 160px wide, lazily loaded. Previously this pulled the full
          // original for every image in the project just to draw a strip of
          // 60px squares — 30 photos meant tens of megabytes on open.
          return `<img class="lb-thumb" src="${imgURL(src, 160)}"
                    data-raw="${src}" data-index="${i}" alt=""
                    loading="lazy" decoding="async" onerror="${IMG_FALLBACK}">`;
        }
      }).join('');

      strip.addEventListener('click', e => {
        const el = e.target.closest('[data-index]');
        if (el) lbOpen(parseInt(el.dataset.index));
      });

      filmstripBuilt = true;
    }

    function lbOpen(index) {
      lbIndex = index;
      buildFilmstrip();
      lbShow();
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function isVideo(src) {
      return /\.(mp4|mov|webm|ogg)$/i.test(src);
    }

    function lbShow() {
      const item = lbImages[lbIndex];
      const src  = typeof item === 'object' ? item.src : item;
      const caption = typeof item === 'object' ? (item.caption || '') : '';

      const lbImg   = document.getElementById('lb-img');
      const lbVid   = document.getElementById('lb-video');

      if (isVideo(src)) {
        lbImg.style.display = 'none';
        lbVid.style.display = 'block';
        lbVid.pause();
        lbVid.src = src;
        lbVid.load();
      } else {
        lbVid.style.display = 'none';
        lbVid.pause();
        lbVid.src = '';
        lbImg.style.display = 'block';
        // animate
        lbImg.classList.remove('lb-img');
        void lbImg.offsetWidth;
        lbImg.classList.add('lb-img');
        // 1800px is plenty for a full-screen lightbox even on a retina
        // display, and a fraction of the original file size.
        lbImg.dataset.raw = src;
        delete lbImg.dataset.fb;
        lbImg.src = imgURL(src, 1800);
      }

      // counter
      document.getElementById('lb-counter').textContent =
        (lbIndex + 1) + ' / ' + lbImages.length;

      // filmstrip active state
      document.querySelectorAll('.lb-thumb, .lb-thumb-video').forEach((el, i) => {
        el.classList.toggle('active', i === lbIndex);
      });
      // scroll active thumb into view
      const activeThumb = document.querySelector('.lb-thumb.active, .lb-thumb-video.active');
      if (activeThumb) activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

      // preload prev and next images silently
      preloadAdjacent(lbIndex);

      // caption box
      // Decode before displaying — srcs are percent-encoded, so without
      // this the caption reads "D12-3%20%28Test%20%232%29" instead of
      // "D12-3 (Test #2)".
      const rawName = src.split('/').pop().replace(/\.[^.]+$/, '');
      const title   = fileLabel(src) || rawName;
      document.getElementById('lb-caption-title').textContent = title;
      document.getElementById('lb-caption-text').textContent  = caption;
    }

    function lbStep(dir) {
      lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
      lbShow();
    }

    function lbClose() {
      const lbVid = document.getElementById('lb-video');
      lbVid.pause();
      lbVid.src = '';
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
      filmstripBuilt = false; // reset so it rebuilds fresh if reopened on a different project
    }

    document.getElementById('lb-close').addEventListener('click', lbClose);
    document.getElementById('lb-prev').addEventListener('click', () => lbStep(-1));
    document.getElementById('lb-next').addEventListener('click', () => lbStep(1));
    document.getElementById('lightbox').addEventListener('click', e => {
      if (e.target.id === 'lightbox') lbClose();
    });
    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'ArrowLeft')  lbStep(-1);
      if (e.key === 'ArrowRight') lbStep(1);
      if (e.key === 'Escape')     lbClose();
    });

    // ── PROJECT LOADER ─────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const id     = params.get('id');

    if (!id) {
      document.getElementById('proj-error').style.display = 'block';
    } else {
      // Session cache for projects.json, versioned by the file's own
      // Last-Modified time — same strategy index.html uses.
      //
      // The old version cached unconditionally and never re-checked, so a
      // tab opened before a deploy kept showing stale content forever.
      // Now a cheap HEAD request decides: unchanged file reads from cache
      // (no re-download on spam-reload), changed file re-fetches.
      //
      // Note this file is served by nginx on the pi, not from R2 — it costs
      // nothing to check. R2 bandwidth is governed by the Cloudflare edge
      // cache and the browser's HTTP cache, not by this.
      const CACHE_KEY  = 'projectsCache';
      const STAMP_KEY  = 'projectsCacheStamp';

      async function loadProjects() {
        let stamp = '';
        try {
          const head = await fetchWithTimeout('../projects.json', { method: 'HEAD' }, 4000);
          stamp = head.headers.get('Last-Modified') || '';
        } catch { /* HEAD blocked or offline — fall through to a normal fetch */ }

        if (stamp) {
          const cached = sessionStorage.getItem(CACHE_KEY);
          if (cached && sessionStorage.getItem(STAMP_KEY) === stamp) {
            try { return JSON.parse(cached); }
            catch { sessionStorage.removeItem(CACHE_KEY); }
          }
        }

        const res = await fetchWithTimeout(
          `../projects.json?v=${encodeURIComponent(stamp || Date.now())}`, {}, 6000);
        if (!res.ok) throw new Error('Bad response: ' + res.status);
        const data = await res.json();

        // Private browsing and full quotas can both throw here. A failed
        // cache write is not a failed page load.
        try {
          sessionStorage.setItem(CACHE_KEY, JSON.stringify(data));
          sessionStorage.setItem(STAMP_KEY, stamp);
        } catch { /* just means we re-fetch next navigation */ }

        return data;
      }

      const projectsPromise = loadProjects();

      projectsPromise
        .then(projects => {
          const p = projects.find(x => x.id === id);
          if (!p) { document.getElementById('proj-error').style.display = 'block'; return; }

          document.title = `Matthew Julian González — ${p.title}`;
          document.getElementById('proj-subtitle').textContent = p.subtitle;
          document.getElementById('proj-title').textContent    = p.title;

          // normalize images — support both string and {src, caption} formats
          lbImages = (p.images && p.images.length > 0)
            ? p.images.map(img => typeof img === 'string' ? { src: img, caption: '' } : img)
            : [];

          // ── GALLERY ────────────────────────────────────────
          const gallery    = document.getElementById('proj-gallery');
          const toggleWrap = document.getElementById('gallery-toggle-wrap');

          if (lbImages.length > 0) {
            gallery.innerHTML = lbImages.map((item, i) => {
              const isVid = /\.(mp4|mov|webm|ogg)$/i.test(item.src);
              const el = isVid
                ? `<div class="gallery-video-wrap" data-index="${i}">
                     <video class="gallery-video" muted loop playsinline preload="metadata">
                       <source src="${item.src}">
                     </video>
                     <div class="gallery-play-icon"></div>
                   </div>`
                : `<img
                     src="${imgURL(item.src, 700)}"
                     data-raw="${item.src}"
                     class="gallery-img"
                     alt="${p.title} ${i + 1}"
                     data-index="${i}"
                     loading="lazy"
                     decoding="async"
                     onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src=this.dataset.raw;}else{this.parentElement.style.display='none';}"
                   >`;
              return `<div class="col-6 col-sm-3 ${i >= GALLERY_LIMIT ? 'gallery-extra' : ''}">${el}</div>`;
            }).join('');

            // autoplay video thumbnails on hover
            gallery.addEventListener('mouseenter', e => {
              const wrap = e.target.closest('.gallery-video-wrap');
              if (wrap) wrap.querySelector('video').play();
            }, true);
            gallery.addEventListener('mouseleave', e => {
              const wrap = e.target.closest('.gallery-video-wrap');
              if (wrap) { const v = wrap.querySelector('video'); v.pause(); v.currentTime = 0; }
            }, true);

            if (lbImages.length > GALLERY_LIMIT) {
              const remaining = lbImages.length - GALLERY_LIMIT;
              const btn = document.createElement('button');
              btn.className = 'see-more-btn';
              btn.textContent = `+ ${remaining} more`;
              btn.addEventListener('click', () => lbOpen(GALLERY_LIMIT));
              toggleWrap.appendChild(btn);
            }

            gallery.addEventListener('click', e => {
              const el = e.target.closest('.gallery-img, .gallery-video-wrap');
              if (el) lbOpen(parseInt(el.dataset.index));
            });

          } else {
            gallery.innerHTML = `
              <div class="col-6 col-sm-3"><div class="gallery-cell"><span>image 1</span></div></div>
              <div class="col-6 col-sm-3"><div class="gallery-cell"><span>image 2</span></div></div>
              <div class="col-6 col-sm-3"><div class="gallery-cell"><span>image 3</span></div></div>
              <div class="col-6 col-sm-3"><div class="gallery-cell"><span>image 4</span></div></div>
            `;
          }

          // ── DOCUMENTS ──────────────────────────────────────
          // Optional. Projects with no `documents` array render nothing,
          // and .doc-row:empty collapses the container entirely.
          const docRow = document.getElementById('proj-documents');
          const docs   = Array.isArray(p.documents) ? p.documents : [];

          if (docRow && docs.length > 0) {
            docRow.innerHTML = docs.map((d, i) => {
              const src   = typeof d === 'string' ? d : d.src;
              if (!src) return '';
              const title   = (typeof d === 'object' && d.title) ? d.title : fileLabel(src);
              const caption = (typeof d === 'object' && d.caption) ? d.caption.trim() : '';
              const k = FILE_KINDS[kindOf(src)];
              return `
                <a class="doc-chip${caption ? ' has-caption' : ''}"
                   href="${escapeHtml(src)}" ${linkAttrs(src)}
                   data-kind="${kindOf(src)}"
                   style="--kind:${k.color};--kind-dim:${k.dim}">
                  ${glyphFor(src)}
                  <span class="doc-text">
                    <span class="doc-title">${escapeHtml(title)}</span>
                    ${caption ? `<span class="doc-caption">${escapeHtml(caption)}</span>` : ''}
                    <span class="doc-sub" data-doc-sub="${i}">${escapeHtml(fileExt(src))}</span>
                  </span>
                </a>`;
            }).join('');

            // Fill in file sizes after the chips are already on screen,
            // so a slow or blocked HEAD request never delays rendering.
            docs.forEach((d, i) => {
              const src = typeof d === 'string' ? d : d.src;
              const el  = docRow.querySelector(`[data-doc-sub="${i}"]`);
              if (src && el) appendFileSize(src, el);
            });
          }

          // ── DESCRIPTION ────────────────────────────────────
          if (p.description && p.description.length > 0) {
            document.getElementById('proj-description').innerHTML =
              p.description.map(para => `<p class="project-desc">${para}</p>`).join('');
          }

          // ── SKILLS ─────────────────────────────────────────
          if (p.skills && p.skills.length > 0) {
            document.getElementById('proj-skills').innerHTML =
              p.skills.map(s => `<span class="skill-tag">${s}</span>`).join('');
          }
        })
        .catch(() => { document.getElementById('proj-error').style.display = 'block'; });
    }
  </script>
</body>
</html>
